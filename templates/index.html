<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Recommendation System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: 'Arial', sans-serif;
        }
        .card-upload {
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        .card-upload:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
        }
        .btn-upload {
            background-color: #4a6cf7;
            border-color: #4a6cf7;
            transition: all 0.3s ease;
        }
        .btn-upload:hover {
            background-color: #3a5bdf;
        }
        #resultContainer {
            background-color: #ffffff;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #4a6cf7;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-upload shadow-sm mb-4">
                    <div class="card-body text-center p-5">
                        <h2 class="mb-4">Job Recommendation System</h2>
                        <form id="uploadForm">
                            <div class="mb-3">
                                <label for="resumeInput" class="form-label">
                                    <i class="bi bi-cloud-upload text-primary" style="font-size: 3rem;"></i>
                                    <p class="text-muted">Drag and drop your resume here, or click to select</p>
                                </label>
                                <input type="file" class="form-control" id="resumeInput"
                                       accept=".pdf,.docx" required style="display: none;">
                            </div>
                            <button type="submit" class="btn btn-upload btn-lg text-white">
                                Analyze Resume
                            </button>
                        </form>
                    </div>
                </div>

                <div class="loader" id="loadingIndicator"></div>

                <div id="resultContainer" class="card d-none">
                    <div class="card-body">
                        <h3 class="card-title text-primary mb-4">Recommendation Results</h3>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <h4 class="h6 text-muted">Recommended Job</h4>
                                <p id="recommendedJob" class="fw-bold"></p>
                            </div>
                            <div class="col-md-6 mb-3">
                                <h4 class="h6 text-muted">Job Match Score</h4>
                                <div class="progress">
                                    <div id="matchScoreBar" class="progress-bar" role="progressbar" style="width: 0%">0%</div>
                                </div>
                            </div>
                        </div>
                        <hr>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <h4 class="h6 text-muted">Skills Extracted</h4>
                                <p id="skillsExtracted"></p>
                            </div>
                            <div class="col-md-6">
                                <h4 class="h6 text-muted">Experience Summary</h4>
                                <p id="experienceExtracted"></p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.getElementById('uploadForm');
        const resultContainer = document.getElementById('resultContainer');
        const recommendedJobElement = document.getElementById('recommendedJob');
        const skillsExtractedElement = document.getElementById('skillsExtracted');
        const experienceExtractedElement = document.getElementById('experienceExtracted');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const matchScoreBar = document.getElementById('matchScoreBar');

        // Custom file input trigger
        document.querySelector('label[for="resumeInput"]').addEventListener('click', () => {
            document.getElementById('resumeInput').click();
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const fileInput = document.getElementById('resumeInput');
            const formData = new FormData();
            formData.append('resume', fileInput.files[0]);

            // Reset previous results
            resultContainer.classList.add('d-none');
            matchScoreBar.style.width = '0%';
            matchScoreBar.textContent = '0%';
            matchScoreBar.className = 'progress-bar';

            // Show loading
            loadingIndicator.style.display = 'block';

            try {
                const response = await fetch('/', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                // Update result elements
                recommendedJobElement.textContent = data.recommended_job;
                skillsExtractedElement.textContent = data.skills.join(', ');
                experienceExtractedElement.textContent = data.experience;

                // Match score visualization (optional, you might want to modify backend to provide this)
                const matchScore = Math.min(data.skills.length * 10, 100);
                matchScoreBar.style.width = `${matchScore}%`;
                matchScoreBar.textContent = `${matchScore}%`;

                // Color code match score
                if (matchScore >= 80) {
                    matchScoreBar.classList.add('bg-success');
                } else if (matchScore >= 50) {
                    matchScoreBar.classList.add('bg-warning');
                } else {
                    matchScoreBar.classList.add('bg-danger');
                }

                // Show result
                resultContainer.classList.remove('d-none');

            } catch (error) {
                console.error('Error:', error);
                alert('Failed to process resume. Please try again.');
            } finally {
                // Hide loading
                loadingIndicator.style.display = 'none';
            }
        });
    </script>
</body>
</html>
